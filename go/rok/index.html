<script>
  // JWAT click counter for the ROK Financial partner link (added 2026-11-12).
  // Counts one GA4 event "rok_click" (param link_source = ?s=...), then forwards to ROK. Never blocks the visitor.
  (function () {
    var BASE = 'https://go.mypartner.io/business-financing/?ref=001Qk00000dxUurIAE';
    var params = new URLSearchParams(location.search);
    var src = (params.get('s') || 'direct').replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || 'direct';
    var medium = src === 'web' ? 'referral' : 'social';
    var dest = BASE + '&utm_source=' + encodeURIComponent(src) + '&utm_medium=' + medium + '&utm_campaign=rok-bf-direct';
    window.ROK_DEST = dest;
    var gone = false;
    function go() { if (!gone) { gone = true; location.replace(dest); } }
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-W8W4W8LPNC', { send_page_view: false, cookie_flags: 'SameSite=None;Secure' });
    gtag('event', 'rok_click', { link_source: src, partner: 'rok_financial', transport_type: 'beacon', event_callback: go, event_timeout: 1000 });
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-W8W4W8LPNC';
    document.head.appendChild(s);
    setTimeout(go, 1200);
  })();
</script>
